<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="../static/styles.css">
    <script src="../static/script.js" defer></script>
</head>
<body class="login">
    <div class="overlay">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <input type="text" id="new-username" placeholder="Username" required><br>
            <input type="email" id="email" placeholder="Email" required><br>
            <input type="password" id="new-password" placeholder="Password" required><br>
            <input type="password" id="confirm-password" placeholder="Confirm Password" required><br>
            <button type="submit" class="btn">Sign Up</button>
        </form>
        <p id="signup-message"></p>
        <p>Already have an account? <a href="login.html" class="signup-link">Login</a></p>
    </div>
</body>
</html>
